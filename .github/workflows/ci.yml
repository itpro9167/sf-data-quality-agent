name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest) -- runs fully offline in mock mode, no secrets needed
        env:
          SFDQ_MODE: mock
        run: pytest

  docker:
    name: docker demo image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo image
        run: docker build -t sfdq-demo .

      - name: Smoke-test the container (seeds sample data, serves the dashboard, runs non-root)
        run: |
          docker run -d --name demo -p 8000:8000 sfdq-demo
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/healthz > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8000/healthz | grep -q '"pending":232'
          curl -fs http://localhost:8000/ | grep -q "Public demo"
          test "$(docker exec demo id -u)" != "0"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs demo || true
