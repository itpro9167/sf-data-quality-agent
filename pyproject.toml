[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sf-data-quality-agent"
version = "0.1.0"
description = "AI agent that audits Salesforce data quality and proposes fixes a human must approve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "simple-salesforce>=1.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
sfdq = "sfdq.cli:app"
sfdq-mcp = "sfdq.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfdq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008"]  # typer/fastapi use function calls in argument defaults by design

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/sfdq"]

[[tool.mypy.overrides]]
module = ["simple_salesforce.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/sfdq/agent/mock_llm.py" = ["E501"]  # canned prose templates read better unwrapped
"src/sfdq/eval/report.py" = ["E501"]  # markdown report templates read better unwrapped
